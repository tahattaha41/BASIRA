name: BASIRA | Build and test
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: pip install markdown
      - name: منطق الحساب
        run: node qa/core-test.mjs
      - name: بناء القالب وملف الاستيراد
        run: python3 scripts/build.py
      - name: فحص XML والعناصر المطلوبة
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for f in ('dist/basira-theme.xml', 'dist/basira-import.xml'): ET.parse(f)
          ns = {'b': 'http://www.google.com/2005/gml/b'}
          root = ET.parse('dist/basira-theme.xml').getroot()
          body = root.find('{http://www.w3.org/1999/xhtml}body')
          assert any(s.attrib.get('id') == 'main' for s in body.findall('b:section', ns)), 'main section must be a direct body child'
          assert root.find(".//b:section[@id='main']/b:widget[@id='Blog1']/b:includable[@id='main']", ns) is not None
          t = open('dist/basira-theme.xml', encoding='utf-8').read()
          for k in ("id='main-content'", 'DQ-AD-GATE', "name='description'"): assert k in t, k
          print('theme OK')
          PY
      - name: Verify existing Blogger API connection (read-only)
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python3 scripts/check_blogger_connection.py
      - name: Reject legacy brand references
        run: |
          if grep -rInE 'دقّة|daqqa-theme|daqqa-import|Smart Choice' src scripts dist qa docs; then
            echo 'Legacy brand reference found'; exit 1;
          fi
      - name: Upload Blogger release files
        uses: actions/upload-artifact@v4
        with:
          name: basira-blogger-release
          path: |
            dist/basira-theme.xml
            dist/basira-import.xml
          if-no-files-found: error
          retention-days: 14
