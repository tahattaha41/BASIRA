name: BASIRA platform build

on:
  push:
    branches: [platform-dev, basira-brand-identity]
  pull_request:
    branches: [platform-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Blogger theme and static page package
        run: python scripts/build.py
      - name: Validate generated platform experience
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = Path('.')
          site = json.loads((root / 'src/site.json').read_text(encoding='utf-8'))
          theme = root / 'dist/theme.xml'
          text = theme.read_text(encoding='utf-8')
          ET.parse(theme)
          required = ['اعرف أكثر', 'تصفّح بالموضوع', 'تقدّمك وإنجازاتك', 'كيف نتحقق من المعلومات', 'سؤال اليوم']
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Missing homepage sections: ' + ', '.join(missing))
          if len(site.get('topics', [])) < 8:
              raise SystemExit('Expected at least 8 knowledge topics')
          if len(site.get('games', [])) < 5:
              raise SystemExit('Expected at least 5 game concepts')
          if '{{' in text:
              raise SystemExit('Unresolved template placeholder')
          pages = root / 'dist/pages'
          if not (pages / 'about.html').is_file():
              raise SystemExit('About page was not generated')
          print(f"Validated {len(site['topics'])} topics, {len(site['games'])} game concepts, theme XML and static pages.")
          PY
      - name: Package Blogger files
        run: |
          mkdir -p release
          cp dist/theme.xml release/basira-platform-theme.xml
          cp -R dist/pages release/pages
          cd release && zip -r ../basira-platform-release.zip .
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: basira-platform-release
          path: basira-platform-release.zip
          retention-days: 14
