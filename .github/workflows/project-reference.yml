name: BASIRA project reference

on:
  push:
    branches: ["**"]
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: basira-project-reference-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the changed branch (or default branch for issues)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issues' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh activity and request log
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.event_name == 'issues' && github.event.repository.default_branch || github.ref_name }}
        run: python scripts/update_project_reference.py

      - name: Commit reference update
        env:
          TARGET_BRANCH: ${{ github.event_name == 'issues' && github.event.repository.default_branch || github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "Reference is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_ACTIVITY.md docs/REQUEST_LOG.md
          git commit -m "docs: automatically refresh BASIRA project reference [skip ci]"
          git push origin "HEAD:$TARGET_BRANCH"
