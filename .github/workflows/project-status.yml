name: BASIRA — Automatic project report

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate activity report
        run: python3 scripts/update_project_activity.py
      - name: Upload generated report
        uses: actions/upload-artifact@v4
        with:
          name: basira-project-activity
          path: docs/PROJECT_ACTIVITY.md
          retention-days: 30

  commit-report:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout pushed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Download generated report
        uses: actions/download-artifact@v4
        with:
          name: basira-project-activity
          path: generated
      - name: Update report in the same branch
        run: |
          mkdir -p docs
          cp generated/PROJECT_ACTIVITY.md docs/PROJECT_ACTIVITY.md
          if git diff --quiet -- docs/PROJECT_ACTIVITY.md; then
            echo "Activity report is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_ACTIVITY.md
          git commit -m "docs: auto-update project activity report [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
