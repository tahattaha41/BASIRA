name: BASIRA release readiness

on:
  push:
    branches: [basira-publish-readiness]
  pull_request:
    branches: [platform-dev]
  workflow_dispatch:
    inputs:
      strict_release_check:
        description: "Run strict release checks (requires a verified contact email and confirmed Blogger page routes)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Blogger theme and page package
        run: python scripts/build.py
      - name: Validate XML and release preflight
        env:
          BASIRA_RELEASE_STRICT: ${{ inputs.strict_release_check && '1' || '0' }}
          BASIRA_CONTACT_EMAIL: ${{ secrets.BASIRA_CONTACT_EMAIL }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          theme = Path("dist/theme.xml")
          ElementTree.parse(theme)
          assert theme.stat().st_size > 1000, "Generated Blogger theme is unexpectedly small"
          print("Blogger XML parsed successfully.")
          PY
          if [ "$BASIRA_RELEASE_STRICT" = "1" ]; then
            python scripts/release_preflight.py --strict
          else
            python scripts/release_preflight.py
          fi
      - name: Package review artifact
        run: |
          mkdir -p release
          cp dist/theme.xml release/basira-platform-theme.xml
          cp -R dist/pages release/pages
          cd release
          zip -qr ../basira-platform-release.zip .
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: basira-platform-release
          path: basira-platform-release.zip
          retention-days: 14

# This workflow intentionally does NOT publish to Blogger.
# Blogger API v3 can manage posts/pages, but does not expose a Theme XML upload API.
# Publishing a theme therefore still requires Blogger's Theme UI. Page creation also
# requires owner-approved OAuth credentials and verified resulting page URLs.
