name: BASIRA CI

on:
  push:
    branches: [main, platform-dev]
    paths-ignore:
      - 'dist/**'
      - 'preview/**'
  pull_request:
  workflow_dispatch:
    inputs:
      strict_release_check:
        description: "Strict release check (needs verified contact email and confirmed Blogger page routes)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: basira-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build theme and pages
        run: python scripts/build.py
      - name: Release preflight (XML, pages, sections, games, links, secrets, stale dist)
        env:
          BASIRA_RELEASE_STRICT: ${{ inputs.strict_release_check && '1' || '0' }}
          BASIRA_CONTACT_EMAIL: ${{ secrets.BASIRA_CONTACT_EMAIL }}
        run: python scripts/release_preflight.py
      - name: Static theme tests
        run: python qa/test_theme.py
      - name: Content tests (8 sections, 500+ words, sources, computed examples)
        run: python qa/content_test.py
      - name: Phase docs exist
        run: test -s docs/PHASE3-DESIGN.md
      - name: Contrast tests (design tokens, WCAG)
        run: python qa/contrast_test.py
      - name: Publish-path tests (offline)
        run: python qa/publish_test.py
      - name: Install browser test dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: UI tests (languages, search, sizes)
        run: python qa/ui_test.py
      - name: Touch drag test (real touch events)
        run: python qa/touch_test.py
      - name: Sound tests (muted by default, toggle, persistence)
        run: python qa/sound_test.py
      - name: Reward tests (animations, XP, level-up)
        run: python qa/reward_test.py
      - name: Game tests (real play-through)
        run: python qa/game_test.py
      - name: Habit (streak, chest, progress code)
        run: python qa/habit_test.py
      - name: Bubbles game
        run: python qa/bubbles_test.py
      - name: Generated games, friend challenges, skill games
        run: python qa/games7_test.py && python qa/games6_test.py && python qa/friend_test.py && python qa/skill_test.py
      - name: Admin panel
        run: python qa/admin_test.py
      - name: Character games test
        run: python qa/chars_test.py
      - name: Lantern game
        run: python qa/lantern_test.py
      - name: Real-skill games (swarm, flip, mirrors)
        timeout-minutes: 6
        run: python qa/real_test.py
      - name: Analytics snippet test
        run: python qa/ga_test.py
      - name: Embedded admin page
        run: python qa/admin_embed_test.py
      - name: v5 (cards, routing, filters, new games)
        run: python qa/v5_test.py
      - name: Reject leftovers of the old site
        run: |
          if grep -rInEi 'daqqa|smart[- ]choice|bayan|DQ-AD-GATE' src scripts dist qa docs brand content .github CLAUDE.md --exclude-dir=__pycache__ --exclude-dir=preview --exclude=basira-ci.yml; then
            echo "Old-site reference found"; exit 1; fi
      - name: Verify Blogger API connection (read-only; skipped without secrets)
        if: github.event_name != 'pull_request'
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python scripts/check_blogger_connection.py
      - name: Refresh public Blogger assets on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists; skipping stale asset publication."
            exit 0
          fi
          git add dist/basira.css dist/basira.js
          if git diff --cached --quiet; then
            echo "Public assets are unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: refresh Blogger remote assets [skip ci]"
            git push origin HEAD:main
          fi
      - name: Package for review
        run: |
          mkdir -p release && cp dist/theme.xml release/basira-theme.xml && cp dist/basira.css dist/basira.js release/ && cp -R dist/pages release/pages
          cd release && zip -r ../basira-release.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: basira-release
          path: basira-release.zip
          retention-days: 14
